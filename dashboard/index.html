<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Laptop Price Monitor – VN Retail</title>
<style>
:root{
  --bg:#f0f2f5;--card:#fff;--hdr:#0f1729;--accent:#2563eb;--accent2:#7c3aed;
  --teal:#0d9488;
  /* PRICE LOGIC: drop = RED (bad for buyer = price went down is good, but Vietnamese retail context: 
     user said giảm=đỏ, tăng=xanh */
  --drop:#dc2626;   /* red  = price drop */
  --rise:#16a34a;   /* green = price rise */
  --drop-bg:#fee2e2; --drop-light:#fef2f2;
  --rise-bg:#dcfce7; --rise-light:#f0fdf4;
  --orange:#ea580c;
  --text:#111827;--text2:#6b7280;--border:#e5e7eb;--radius:10px;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);font-size:14px}

/* HEADER */
.hdr{background:var(--hdr);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.hdr-left h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.hdr-left .meta{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.1);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.mbw{border-left:3px solid #60a5fa}
.badge.fpt{border-left:3px solid #a78bfa}
.badge.cps{border-left:3px solid #34d399}

/* TABS */
.tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 20px;overflow-x:auto;gap:0}
.tab{padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--text2);transition:all .15s;white-space:nowrap;flex-shrink:0;user-select:none}
.tab:hover{color:var(--accent)}
.tab.active{color:var(--accent);border-color:var(--accent)}

/* MAIN */
.main{padding:16px 20px;max-width:1600px;margin:0 auto}
.section{display:none}.section.active{display:block}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:800}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text);background:#fff;outline:none;transition:border .15s}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent)}
.filter-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
.filter-sep{width:1px;height:20px;background:var(--border)}

/* SECTION TITLE */
.sec-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cnt{background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}

/* ALERT GRID */
.alert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:20px}
.ac{background:var(--card);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);border-left:4px solid var(--border);transition:transform .15s,box-shadow .15s}
.ac:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.ac.drop{border-left-color:var(--drop);background:var(--drop-light)}
.ac.rise{border-left-color:var(--rise);background:var(--rise-light)}
.ac.bigdrop{border-left-color:var(--orange);background:#fff7ed}
.ac-name{font-weight:700;font-size:12px;line-height:1.35;margin-bottom:5px;color:var(--text)}
.dlr{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-bottom:6px}
.dlr-mbw{background:#dbeafe;color:#1d4ed8}
.dlr-fpt{background:#ede9fe;color:#5b21b6}
.dlr-cps{background:#d1fae5;color:#065f46}
.prices{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.p-old{color:var(--text2);text-decoration:line-through;font-size:12px}
.p-arrow{font-size:15px;opacity:.7}
.p-new{font-size:15px;font-weight:800}
.p-new.drop-c{color:var(--drop)}
.p-new.rise-c{color:var(--rise)}
.badge-delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.bd-drop{background:var(--drop-bg);color:var(--drop)}
.bd-rise{background:var(--rise-bg);color:var(--rise)}
.ac-detail{font-size:11px;color:var(--text2);margin-top:2px}

/* RANKING TABLES */
.rank-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.rank-hdr{color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.rank-hdr.drop-hdr{background:linear-gradient(135deg,#b91c1c,#dc2626)}
.rank-hdr.rise-hdr{background:linear-gradient(135deg,#14532d,#16a34a)}
.rank-hdr.blue-hdr{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.rank-hdr.teal-hdr{background:linear-gradient(135deg,var(--teal),#0284c7)}
.rank-hdr h3{font-size:13px;font-weight:700}
.rank-hdr small{font-size:11px;opacity:.75}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:#f9fafb;padding:8px 11px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:#f0f2f5;color:var(--text)}
tbody td{padding:8px 11px;border-bottom:1px solid #f3f4f6;font-size:12px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafafa}
.rn{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;flex-shrink:0}
.rn1{background:#fef9c3;color:#a16207}
.rn2{background:#f1f5f9;color:#475569}
.rn3{background:#fef3c7;color:#92400e}
.rno{background:#f0f2f5;color:var(--text2)}
.mname{font-weight:600;line-height:1.3}
.gtag{background:#e0e7ff;color:#3730a3;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;white-space:nowrap}
.ctag{background:#ecfdf5;color:#065f46;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;white-space:nowrap}
.ptag{font-weight:800;color:var(--accent);white-space:nowrap}
.lnk{color:var(--accent);font-size:11px;text-decoration:none;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.old-p{color:var(--text2);text-decoration:line-through;font-size:11px;white-space:nowrap}
.chg-drop{color:var(--drop);font-weight:700}
.chg-rise{color:var(--rise);font-weight:700}
.empty{text-align:center;padding:36px;color:var(--text2);font-size:13px}

@media(max-width:768px){
  .main{padding:10px 12px}
  .alert-grid{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .filter-bar{gap:6px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>📊 Laptop Price Monitor – VN Retail</h1>
    <div class="meta" id="hdrMeta">Loading…</div>
  </div>
  <div class="badges">
    <span class="badge mbw" id="bMBW">MBW –</span>
    <span class="badge fpt" id="bFPT">FPT –</span>
    <span class="badge cps" id="bCPS">CPS –</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="sw('alerts')">🔔 Price Alerts</div>
  <div class="tab" onclick="sw('drops')">📉 Top Price Changes</div>
  <div class="tab" onclick="sw('gaming')">🎮 Gaming by GPU</div>
  <div class="tab" onclick="sw('bp')">💼 B&amp;P by CPU</div>
</div>

<div class="main">

<!-- ── TAB 1: PRICE ALERTS ── -->
<div class="section active" id="sec-alerts">
  <div class="kpi-row" id="kpiRow"></div>
  <div class="filter-bar">
    <span class="filter-lbl">Filter</span>
    <div class="filter-sep"></div>
    <select id="a_dealer" onchange="renderAlerts()">
      <option value="">All Dealers</option>
      <option value="MBW">MBW (TGDĐ)</option>
      <option value="FPT Retail">FPT Retail</option>
      <option value="CellPhone S">CellPhone S</option>
    </select>
    <select id="a_dir" onchange="renderAlerts()">
      <option value="">Price ↑ &amp; ↓</option>
      <option value="drop">Drops only ▼</option>
      <option value="rise">Rises only ▲</option>
    </select>
    <select id="a_seg" onchange="renderAlerts()">
      <option value="">All Segments</option>
      <option value="Gaming">Gaming</option>
      <option value="bp">Business &amp; Productivity</option>
    </select>
    <input id="a_search" type="text" placeholder="🔍 Search model…" oninput="renderAlerts()" style="min-width:180px"/>
  </div>
  <div class="sec-title">
    Price changes: <b id="todayLbl"></b> vs <b id="prevLbl"></b>
    <span class="cnt" id="alertCnt">0</span>
    <small style="font-size:11px;font-weight:400;color:var(--text2)">&nbsp;· 🔴 = price drop&nbsp; 🟢 = price rise</small>
  </div>
  <div class="alert-grid" id="alertGrid"></div>
</div>

<!-- ── TAB 2: TOP PRICE CHANGES ── -->
<div class="section" id="sec-drops">
  <div class="filter-bar">
    <span class="filter-lbl">Show</span>
    <div class="filter-sep"></div>
    <select id="d_topN" onchange="renderDrops()">
      <option value="10">Top 10</option>
      <option value="20" selected>Top 20</option>
      <option value="30">Top 30</option>
    </select>
    <select id="d_dealer" onchange="renderDrops()">
      <option value="">All Dealers</option>
      <option value="MBW">MBW</option>
      <option value="FPT Retail">FPT Retail</option>
      <option value="CellPhone S">CellPhone S</option>
    </select>
    <select id="d_seg" onchange="renderDrops()">
      <option value="">All Segments</option>
      <option value="Gaming">Gaming</option>
      <option value="bp">Business &amp; Productivity</option>
    </select>
    <input id="d_search" type="text" placeholder="🔍 Search model…" oninput="renderDrops()" style="min-width:180px"/>
  </div>
  <div id="dropsContainer"></div>
</div>

<!-- ── TAB 3: GAMING by GPU ── -->
<div class="section" id="sec-gaming">
  <div class="filter-bar">
    <span class="filter-lbl">Filter</span>
    <div class="filter-sep"></div>
    <select id="g_vga" onchange="renderGaming()"><option value="">All GPUs</option></select>
    <select id="g_dealer" onchange="renderGaming()">
      <option value="">All Dealers</option>
      <option value="MBW">MBW</option>
      <option value="FPT Retail">FPT Retail</option>
      <option value="CellPhone S">CellPhone S</option>
    </select>
    <input id="g_search" type="text" placeholder="🔍 Search model…" oninput="renderGaming()" style="min-width:180px"/>
  </div>
  <div id="gamingContainer"></div>
</div>

<!-- ── TAB 4: B&P by CPU ── -->
<div class="section" id="sec-bp">
  <div class="filter-bar">
    <span class="filter-lbl">Filter</span>
    <div class="filter-sep"></div>
    <select id="b_cpu" onchange="renderBP()"><option value="">All CPUs</option></select>
    <select id="b_dealer" onchange="renderBP()">
      <option value="">All Dealers</option>
      <option value="MBW">MBW</option>
      <option value="FPT Retail">FPT Retail</option>
      <option value="CellPhone S">CellPhone S</option>
    </select>
    <input id="b_search" type="text" placeholder="🔍 Search model…" oninput="renderBP()" style="min-width:180px"/>
  </div>
  <div id="bpContainer"></div>
</div>

</div>

const {todayDate,prevDate,allToday,drops,rises,changes,stats} = DATA;

// ── FORMAT ──────────────────────────────────────────────
const vnd = n => n?Number(n).toLocaleString('vi-VN')+'₫':'–';
const dlrCls = d => d==='MBW'?'dlr-mbw':d==='FPT Retail'?'dlr-fpt':'dlr-cps';
const rnCls  = i => i===0?'rn1':i===1?'rn2':i===2?'rn3':'rno';
const isBP   = p => p.segment && p.segment !== 'Gaming';

// ── INIT ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('hdrMeta').textContent =
    `Today: ${todayDate}  ·  Compared to: ${prevDate}  ·  ${stats.totalToday} SKUs tracked`;
  document.getElementById('bMBW').textContent = `MBW ${stats.mbw}`;
  document.getElementById('bFPT').textContent = `FPT ${stats.fpt}`;
  document.getElementById('bCPS').textContent = `CPS ${stats.cps}`;
  document.getElementById('todayLbl').textContent = todayDate;
  document.getElementById('prevLbl').textContent  = prevDate;

  // GPU options (Gaming, non-UMA)
  const gpus = [...new Set(allToday.filter(p=>p.segment==='Gaming'&&p.gpuTag&&p.gpuTag!=='UMA').map(p=>p.gpuTag))].sort();
  const gSel = document.getElementById('g_vga');
  gpus.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;gSel.appendChild(o);});

  // CPU options (B&P, clean values)
  const cpuSet = [...new Set(allToday.filter(p=>isBP(p)&&p.cpuFamily&&p.cpuFamily.length<25&&!p.cpuFamily.startsWith('#')).map(p=>p.cpuFamily))].sort();
  const cSel = document.getElementById('b_cpu');
  cpuSet.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cSel.appendChild(o);});

  renderKPIs(); renderAlerts(); renderDrops(); renderGaming(); renderBP();
});

// ── KPIs ────────────────────────────────────────────────
function renderKPIs(){
  const bigDrops = drops.filter(c=>Math.abs(c.pct)>=5);
  const avgPct = drops.length?(drops.reduce((a,c)=>a+c.pct,0)/drops.length).toFixed(1):'0';
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi"><div class="kpi-lbl">📦 Total SKUs Today</div><div class="kpi-val">${stats.totalToday}</div><div class="kpi-sub">${todayDate}</div></div>
    <div class="kpi"><div class="kpi-lbl">🎮 Gaming</div><div class="kpi-val">${stats.gaming}</div><div class="kpi-sub">${stats.bp} B&P</div></div>
    <div class="kpi"><div class="kpi-lbl" style="color:var(--drop)">▼ Price Drops</div><div class="kpi-val" style="color:var(--drop)">${stats.drops}</div><div class="kpi-sub">Avg ${avgPct}%</div></div>
    <div class="kpi"><div class="kpi-lbl" style="color:var(--rise)">▲ Price Rises</div><div class="kpi-val" style="color:var(--rise)">${stats.rises}</div><div class="kpi-sub">vs ${prevDate}</div></div>
    <div class="kpi"><div class="kpi-lbl" style="color:var(--orange)">🔥 Big Drops ≥5%</div><div class="kpi-val" style="color:var(--orange)">${bigDrops.length}</div><div class="kpi-sub">products</div></div>`;
}

// ── TAB 1: PRICE ALERTS ─────────────────────────────────
function renderAlerts(){
  const dF=document.getElementById('a_dealer').value;
  const dirF=document.getElementById('a_dir').value;
  const segF=document.getElementById('a_seg').value;
  const sF=document.getElementById('a_search').value.toLowerCase();
  let data = changes.filter(c=>{
    if(dF&&c.dealer!==dF) return false;
    if(dirF==='drop'&&c.delta>=0) return false;
    if(dirF==='rise'&&c.delta<=0) return false;
    if(segF==='Gaming'&&c.segment!=='Gaming') return false;
    if(segF==='bp'&&!isBP(c)) return false;
    if(sF&&!c.model.toLowerCase().includes(sF)) return false;
    return true;
  }).sort((a,b)=>a.pct-b.pct);

  document.getElementById('alertCnt').textContent = data.length;
  if(!data.length){
    document.getElementById('alertGrid').innerHTML='<div class="empty" style="grid-column:1/-1">No price changes match the current filters.</div>';
    return;
  }
  document.getElementById('alertGrid').innerHTML = data.map(c=>{
    const isDrop=c.delta<0, isBig=isDrop&&Math.abs(c.pct)>=5;
    const cls=isBig?'bigdrop':isDrop?'drop':'rise';
    const bdCls=isDrop?'bd-drop':'bd-rise', pCls=isDrop?'drop-c':'rise-c';
    const sign=isDrop?'':'+', arrow=isDrop?'↘':'↗';
    return `<div class="ac ${cls}">
      <div class="ac-name">${c.model}</div>
      <span class="dlr ${dlrCls(c.dealer)}">${c.dealer}</span>
      <div class="prices">
        <span class="p-old">${vnd(c.prevPrice)}</span>
        <span class="p-arrow">${arrow}</span>
        <span class="p-new ${pCls}">${vnd(c.todayPrice)}</span>
        <span class="badge-delta ${bdCls}">${sign}${c.pct}%</span>
      </div>
      <div class="ac-detail">Change: <b style="color:${isDrop?'var(--drop)':'var(--rise)'}">${sign}${vnd(Math.abs(c.delta))}</b>
        ${c.link?`&nbsp;·&nbsp;<a class="lnk" href="${c.link}" target="_blank">View ↗</a>`:''}
      </div>
      ${isBig?'<div style="font-size:10px;color:var(--orange);font-weight:700;margin-top:4px">🔥 Big drop!</div>':''}
    </div>`;
  }).join('');
}

// ── TAB 2: TOP PRICE CHANGES ────────────────────────────
function renderDrops(){
  const N=parseInt(document.getElementById('d_topN').value);
  const dF=document.getElementById('d_dealer').value;
  const segF=document.getElementById('d_seg').value;
  const sF=document.getElementById('d_search').value.toLowerCase();
  const filt = c=>(!dF||c.dealer===dF)&&(segF==='Gaming'?c.segment==='Gaming':segF==='bp'?isBP(c):true)&&(!sF||c.model.toLowerCase().includes(sF));

  const byAbs  = [...changes].filter(c=>c.delta<0&&filt(c)).sort((a,b)=>a.delta-b.delta).slice(0,N);
  const byPct  = [...changes].filter(c=>c.delta<0&&filt(c)).sort((a,b)=>a.pct-b.pct).slice(0,N);
  const byRise = [...changes].filter(c=>c.delta>0&&filt(c)).sort((a,b)=>b.pct-a.pct).slice(0,N);

  document.getElementById('dropsContainer').innerHTML =
    mkTable(`📉 Top ${N} Biggest Drops — by Value (₫)`,`Sorted by largest absolute price decrease`,byAbs,'drop')+
    mkTable(`📊 Top ${N} Biggest Drops — by % Change`,`Sorted by largest percentage decrease`,byPct,'drop')+
    (byRise.length?mkTable(`📈 Top ${N} Price Rises`,`Sorted by largest percentage increase`,byRise,'rise'):'');
}

function mkTable(title,sub,data,mode){
  if(!data.length) return `<div class="empty">No data for current filters.</div>`;
  const rows=data.map((c,i)=>{
    const isDrop=c.delta<0, sign=isDrop?'':'+', chgCls=isDrop?'chg-drop':'chg-rise';
    return `<tr>
      <td><span class="rn ${rnCls(i)}">${i+1}</span></td>
      <td><div class="mname">${c.model}</div><span class="dlr ${dlrCls(c.dealer)}" style="font-size:9px;padding:1px 4px">${c.dealer}</span></td>
      <td>${vnd(c.prevPrice)}</td>
      <td class="ptag">${vnd(c.todayPrice)}</td>
      <td class="${chgCls}">${sign}${vnd(Math.abs(c.delta))}</td>
      <td><span class="badge-delta ${isDrop?'bd-drop':'bd-rise'}">${c.pct>0?'+':''}${c.pct}%</span></td>
      <td>${c.gpuTag&&c.gpuTag!=='UMA'?`<span class="gtag">${c.gpuTag}</span>`:'–'}</td>
      <td>${c.link?`<a class="lnk" href="${c.link}" target="_blank">View ↗</a>`:'–'}</td>
    </tr>`;
  }).join('');
  const hdrCls=mode==='drop'?'drop-hdr':'rise-hdr';
  return `<div class="rank-wrap">
    <div class="rank-hdr ${hdrCls}"><h3>${title}</h3><small>${sub} · ${prevDate} → ${todayDate}</small></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Model</th><th>Price (${prevDate})</th><th>Price (${todayDate})</th><th>Change (₫)</th><th>Change (%)</th><th>GPU</th><th>Link</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

// ── TAB 3: GAMING by GPU ────────────────────────────────
function renderGaming(){
  const vF=document.getElementById('g_vga').value;
  const dF=document.getElementById('g_dealer').value;
  const sF=document.getElementById('g_search').value.toLowerCase();
  const ef = p=>p.todayPrice||0;
  let data=allToday.filter(p=>p.segment==='Gaming'&&(!dF||p.dealer===dF)&&(!vF||p.gpuTag===vF)&&(!sF||p.model.toLowerCase().includes(sF)));

  const gpuMap={};
  data.forEach(p=>{const g=p.gpuTag||'Other';if(!gpuMap[g])gpuMap[g]=[];gpuMap[g].push(p);});
  const gpuList=Object.entries(gpuMap).filter(([,a])=>a.length>0)
    .sort((a,b)=>Math.min(...a[1].map(ef))-Math.min(...b[1].map(ef)));

  if(!gpuList.length){document.getElementById('gamingContainer').innerHTML='<div class="empty">No Gaming products match the current filters.</div>';return;}
  document.getElementById('gamingContainer').innerHTML=gpuList.map(([gpu,prods])=>{
    const sorted=[...prods].sort((a,b)=>ef(a)-ef(b)).slice(0,30);
    const rows=sorted.map((p,i)=>{
      const hasPrev=p.prevPrice&&p.prevPrice!==p.todayPrice;
      const isDrop=hasPrev&&p.todayPrice<p.prevPrice;
      const isRise=hasPrev&&p.todayPrice>p.prevPrice;
      const chgHtml=hasPrev?`<span class="badge-delta ${isDrop?'bd-drop':'bd-rise'}" style="font-size:10px">${isDrop?'':'+'}${((p.todayPrice-p.prevPrice)/p.prevPrice*100).toFixed(1)}%</span>`:'';
      return `<tr>
        <td><span class="rn ${rnCls(i)}">${i+1}</span></td>
        <td><div class="mname">${p.model}</div><span class="dlr ${dlrCls(p.dealer)}" style="font-size:9px;padding:1px 4px">${p.dealer}</span></td>
        <td>${p.gpuTag&&p.gpuTag!=='UMA'?`<span class="gtag">${p.gpuTag}</span>`:'Integrated'}</td>
        <td>${p.cpuFamily||'–'}</td>
        <td>${p.ram||'–'}</td>
        <td>${p.ssd||'–'}</td>
        <td class="ptag">${vnd(ef(p))}</td>
        <td>${hasPrev?`<span class="old-p">${vnd(p.prevPrice)}</span>`:'–'}</td>
        <td>${chgHtml||'–'}</td>
        <td>${p.link?`<a class="lnk" href="${p.link}" target="_blank">View ↗</a>`:'–'}</td>
      </tr>`;
    }).join('');
    return `<div class="rank-wrap">
      <div class="rank-hdr blue-hdr"><h3>🎮 ${gpu} — Price Ranking (Low → High)</h3><small>Top ${sorted.length}/${prods.length} SKUs · Price = Giá KM (Col N)</small></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>Model</th><th>GPU</th><th>CPU</th><th>RAM</th><th>Storage</th><th>Price (${todayDate})</th><th>Prev Price</th><th>Change</th><th>Link</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('');
}

// ── TAB 4: B&P by CPU ───────────────────────────────────
function renderBP(){
  const cF=document.getElementById('b_cpu').value;
  const dF=document.getElementById('b_dealer').value;
  const sF=document.getElementById('b_search').value.toLowerCase();
  const ef=p=>p.todayPrice||0;
  let data=allToday.filter(p=>isBP(p)&&(!dF||p.dealer===dF)&&(!cF||p.cpuFamily===cF)&&(!sF||p.model.toLowerCase().includes(sF)));

  const cpuMap={};
  data.forEach(p=>{
    const c=(p.cpuFamily&&p.cpuFamily.length<25&&!p.cpuFamily.startsWith('#'))?p.cpuFamily:'Other';
    if(!cpuMap[c])cpuMap[c]=[];cpuMap[c].push(p);
  });
  const cpuList=Object.entries(cpuMap).filter(([,a])=>a.length>0)
    .sort((a,b)=>Math.min(...a[1].map(ef))-Math.min(...b[1].map(ef)));

  if(!cpuList.length){document.getElementById('bpContainer').innerHTML='<div class="empty">No B&P products match the current filters.</div>';return;}
  document.getElementById('bpContainer').innerHTML=cpuList.map(([cpu,prods])=>{
    const sorted=[...prods].sort((a,b)=>ef(a)-ef(b)).slice(0,30);
    const rows=sorted.map((p,i)=>{
      const hasPrev=p.prevPrice&&p.prevPrice!==p.todayPrice;
      const isDrop=hasPrev&&p.todayPrice<p.prevPrice;
      const chgHtml=hasPrev?`<span class="badge-delta ${isDrop?'bd-drop':'bd-rise'}" style="font-size:10px">${isDrop?'':'+'}${((p.todayPrice-p.prevPrice)/p.prevPrice*100).toFixed(1)}%</span>`:'';
      return `<tr>
        <td><span class="rn ${rnCls(i)}">${i+1}</span></td>
        <td><div class="mname">${p.model}</div><span class="dlr ${dlrCls(p.dealer)}" style="font-size:9px;padding:1px 4px">${p.dealer}</span></td>
        <td>${p.cpuFamily&&!p.cpuFamily.startsWith('#')?`<span class="ctag">${p.cpuFamily}</span>`:'–'}</td>
        <td>${p.ram||'–'}</td>
        <td>${p.ssd||'–'}</td>
        <td>${(p.screen||'').replace(/"/g,'″')||'–'}</td>
        <td class="ptag">${vnd(ef(p))}</td>
        <td>${hasPrev?`<span class="old-p">${vnd(p.prevPrice)}</span>`:'–'}</td>
        <td>${chgHtml||'–'}</td>
        <td>${p.link?`<a class="lnk" href="${p.link}" target="_blank">View ↗</a>`:'–'}</td>
      </tr>`;
    }).join('');
    return `<div class="rank-wrap">
      <div class="rank-hdr teal-hdr"><h3>💼 ${cpu} — Price Ranking (Low → High)</h3><small>Top ${sorted.length}/${prods.length} SKUs · Price = Giá KM (Col N)</small></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>Model</th><th>CPU</th><th>RAM</th><th>Storage</th><th>Display</th><th>Price (${todayDate})</th><th>Prev Price</th><th>Change</th><th>Link</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('');
}

// ── TAB SWITCH ──────────────────────────────────────────
function sw(name){
  const map={alerts:0,drops:1,gaming:2,bp:3};
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===map[name]));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
}
</script>
</body>
