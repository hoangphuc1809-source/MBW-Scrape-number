name: Check RAW DATA

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install googleapis@140 --no-save --no-audit --no-fund
      - env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node check-rawdata.js
      - run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f rawdata-check-report.txt ] && [ -n "$(git status --porcelain rawdata-check-report.txt)" ]; then
            git add rawdata-check-report.txt
            git commit -m "chore: rawdata check report [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
