name: scrape-fpt-test

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no GAS write)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  scrape-fpt-fetch:
    name: FPT HTTPS Fetch (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test FPT connectivity
        run: |
          echo "=== Testing FPT connectivity ==="
          HTTP_CODE=$(curl -s -o /tmp/fpt_test.html -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: text/html,*/*" \
            -H "Accept-Language: vi-VN,vi;q=0.9" \
            --compressed --max-time 15 \
            "https://fptshop.com.vn/may-tinh-xach-tay/msi" || echo "000")
          echo "HTTP Code: $HTTP_CODE"
          echo "Response size: $(wc -c < /tmp/fpt_test.html) bytes"
          echo "First 500 chars:"
          head -c 500 /tmp/fpt_test.html
          echo ""
          echo "Contains 'cardInfo': $(grep -c 'cardInfo' /tmp/fpt_test.html || echo 0)"
          echo "Contains 'Just a moment': $(grep -c 'Just a moment' /tmp/fpt_test.html || echo 0)"
          echo "Contains 'msi-gaming': $(grep -c 'msi-gaming' /tmp/fpt_test.html || echo 0)"

      - name: Run FPT Fetch Scraper
        id: scrape
        run: node fpt_byparr_scraper_v2.js
        env:
          GAS_URL: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.GAS_DEPLOYMENT_URL }}
          SHEET_NAME: FPT_TEST
          METHOD_TAG: fetch
        continue-on-error: true

      - name: Job summary
        if: always()
        run: |
          RESULT="${{ steps.scrape.outcome }}"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          echo "## FPT Fetch Scrape — $NOW" >> $GITHUB_STEP_SUMMARY
          if [ "$RESULT" = "success" ]; then
            echo "✅ **Status: SUCCESS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check scrape result
        if: steps.scrape.outcome == 'failure'
        run: exit 1
