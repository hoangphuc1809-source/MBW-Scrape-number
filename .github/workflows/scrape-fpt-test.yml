# ════════════════════════════════════════════════════════════════════
# scrape-fpt-test.yml  —  PARALLEL TEST (v3)
# Pure HTTPS fetch — no Byparr, no browser, no Docker service
# FPT Shop SSR trả full HTML cho plain GET requests
# ════════════════════════════════════════════════════════════════════
name: scrape-fpt-test

on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 VN
    - cron: '0 4 * * *'   # 11:00 VN
    - cron: '0 6 * * *'   # 13:00 VN
    - cron: '0 10 * * *'  # 17:00 VN
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no GAS write)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  scrape-fpt-fetch:
    name: FPT HTTPS Fetch (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Plain fetch = fast, max 10min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run FPT Fetch Scraper
        id: scrape
        run: node fpt_byparr_scraper_v2.js
        env:
          GAS_URL: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.GAS_DEPLOYMENT_URL }}
          SHEET_NAME: FPT_TEST
          METHOD_TAG: fetch
        continue-on-error: true

      - name: Job summary
        if: always()
        run: |
          RESULT="${{ steps.scrape.outcome }}"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          echo "## FPT Fetch Scrape — $NOW" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$RESULT" = "success" ]; then
            echo "✅ **Status: SUCCESS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | ubuntu-latest (no browser!) |" >> $GITHUB_STEP_SUMMARY
          echo "| Method | Pure HTTPS fetch v3.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Sheet | FPT_TEST |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | ${{ github.event.inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check scrape result
        if: steps.scrape.outcome == 'failure'
        run: exit 1
