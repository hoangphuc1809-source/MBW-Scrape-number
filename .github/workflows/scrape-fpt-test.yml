# ════════════════════════════════════════════════════════════════════
# scrape-fpt-test.yml  —  PARALLEL TEST (v4 — GAS approach)
# Không scrape từ GitHub Actions runner (datacenter IP bị CF block)
# Thay vào đó: trigger Google Apps Script để fetch FPT
# GAS dùng UrlFetchApp trên Google server IP → không bị CF block
# ════════════════════════════════════════════════════════════════════
name: scrape-fpt-test

on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 VN
    - cron: '0 4 * * *'   # 11:00 VN
    - cron: '0 6 * * *'   # 13:00 VN
    - cron: '0 10 * * *'  # 17:00 VN
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip GAS trigger)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  trigger-fpt-gas-scrape:
    name: Trigger GAS FPT Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger GAS scrapeFpt
        id: trigger
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Triggering GAS FPT scraper..."
          RESPONSE=$(curl -s -L -X POST "$GAS_URL" \
            -H "Content-Type: application/json" \
            -d '{"action":"scrapeFpt","sheetName":"FPT_TEST"}' \
            --max-time 60)
          echo "Response: $RESPONSE"
          
          # Check success
          SUCCESS=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.loads(sys.stdin.read()); print(d.get('success','?'))" 2>/dev/null || echo "parse_error")
          COUNT=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.loads(sys.stdin.read()); print(d.get('written',0))" 2>/dev/null || echo "0")
          
          echo "Success: $SUCCESS | Products written: $COUNT"
          
          if [ "$SUCCESS" != "True" ] && [ "$SUCCESS" != "true" ]; then
            echo "::error::GAS scraper returned success=false"
            exit 1
          fi
        env:
          GAS_URL: ${{ secrets.GAS_DEPLOYMENT_URL }}

      - name: Dry run notice
        if: github.event.inputs.dry_run == 'true'
        run: echo "Dry run — GAS trigger skipped"

      - name: Job summary
        if: always()
        run: |
          RESULT="${{ steps.trigger.outcome }}"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          echo "## FPT GAS Scrape — $NOW" >> $GITHUB_STEP_SUMMARY
          if [ "$RESULT" = "success" ]; then
            echo "✅ **Status: SUCCESS** (GAS UrlFetchApp)" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESULT" = "skipped" ]; then
            echo "⏭ **Dry run — skipped**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Method | Google Apps Script UrlFetchApp |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | FPT_TEST tab |" >> $GITHUB_STEP_SUMMARY
