name: Pilot FPT specs qua Bright Data Browser API (mau 5 SP)

on:
  workflow_dispatch:

jobs:
  test-specfetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Chay pilot fetch specs (5 SP mau)
        env:
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
        run: node test_fpt_specfetch.js

      - name: Commit ket qua
        if: always()
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p diagnostics
          cp scrape-output/specfetch_* diagnostics/ 2>/dev/null || true
          if [ -n "$(git status --porcelain diagnostics)" ]; then
            git add diagnostics
            git commit -m "diag(fpt): ket qua pilot spec-fetch (5 SP mau) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Khong co gi de commit"
          fi
