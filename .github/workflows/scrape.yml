name: TGDĐ Laptop Scraper — Daily 9AM

on:
  schedule:
    - cron: '0 2 * * *'   # 9:00 sáng giờ VN (UTC+7)
  workflow_dispatch:        # Chạy thủ công bất cứ lúc nào

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Bỏ cache vì không có package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node tgdd_scraper.js
