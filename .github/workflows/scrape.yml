name: Multi-Dealer Laptop Scraper

on:
  # Lich chay nam NGAY TRONG repo - khong phu thuoc Cloud Scheduler ben ngoai.
  # 01:00 UTC = 08:00 gio Viet Nam.
  # Ly do doi: Cloud Scheduler dung PAT, PAT het han thi lich chet am tham
  # (da xay ra 07/2026). Cron cua GitHub khong bao gio het han.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  # MBW (qua Cloudflare Worker proxy) + CellPhone S - chay 100% tu dong
  # tren GitHub-hosted runner, khong can may local.
  scrape-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Ghi moc thoi gian bat dau
        shell: bash
        run: echo "STARTED_AT=$(date +%s)" >> $GITHUB_ENV

      - name: Run scraper (MBW + CPS)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MBW_PROXY_HOST: ${{ secrets.MBW_PROXY_HOST }}
          SCRAPE_DEALERS: MBW,CPS
        run: npm start

      - name: Bao cao ve Telegram
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          DUR=$(( $(date +%s) - ${STARTED_AT:-$(date +%s)} ))
          MIN=$(( DUR / 60 ))
          SEC=$(( DUR % 60 ))
          if [ "${{ job.status }}" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] MBW + CPS%0Amay: cloud (ubuntu-latest)%0Athoi gian: ${MIN} phut ${SEC} giay%0Atrang thai: ${{ job.status }}%0Arun #${{ github.run_number }}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n"

  # FPT Retail - fptshop.com.vn chan bang Cloudflare bot-challenge (KHONG phai
  # chan IP), nen doi IP hay thue VPS deu vo ich. Bat buoc self-hosted.
  # Giu label chung 'self-hosted' de MSI va BARACK deu nhan duoc - day la
  # co che du phong co chu dich, DUNG ghim vao mot may cu the.
  scrape-fpt:
    needs: scrape-cloud
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Ghi moc thoi gian bat dau
        shell: bash
        run: echo "STARTED_AT=$(date +%s)" >> $GITHUB_ENV

      - name: Run scraper (FPT)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SCRAPE_DEALERS: FPT
        run: npm start

      - name: Bao cao ve Telegram
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          DUR=$(( $(date +%s) - ${STARTED_AT:-$(date +%s)} ))
          MIN=$(( DUR / 60 ))
          SEC=$(( DUR % 60 ))
          if [ "${{ job.status }}" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] FPT%0Amay: ${{ runner.name }}%0Athoi gian: ${MIN} phut ${SEC} giay%0Atrang thai: ${{ job.status }}%0Arun #${{ github.run_number }}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n"
