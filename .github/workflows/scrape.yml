name: Multi-Dealer Laptop Scraper

on:
  # 29/07/2026: Phuc yeu cau 3 slot/ngay co dinh (8h/11h/15h VN), TAT toan bo
  # cron du phong/lech gio truoc do. Moi slot chi 1 dong cron (khong con 2
  # dong gan nhau nhu ban cu) vi da co concurrency guard ben duoi de chan
  # 2 run chay chong nhau (day chinh la nguyen nhan gay fail lien tuc 28-29/07).
  # Le tinh UTC (khong doi theo DST vi VN khong co DST): 8h/11h/15h VN = UTC+7
  # -> 01:00 / 04:00 / 08:00 UTC. Dat phut le :05 (khong dung dinh :00) vi
  # GitHub docs canh bao dung gio la cao diem, de bi delay/drop hon le gio.
  schedule:
    - cron: '5 1 * * *' # 01:05 UTC = 08:05 gio VN
    - cron: '5 4 * * *' # 04:05 UTC = 11:05 gio VN
    - cron: '5 8 * * *' # 08:05 UTC = 15:05 gio VN
  workflow_dispatch:

# 29/07/2026: Chan 2 lan chay chong nhau (nguyen nhan gay fail lien tuc
# 28-29/07: scrape-cloud/scrape-fpt cung ghi "RAW DATA" sheet cung luc khi
# 2 run trung gio, vi writeToSheet() la doc-roi-ghi, khong co lock). Neu 1
# run dang chay ma co trigger moi (schedule trung gio hiem gap hoac Phuc bam
# Run workflow thu cong) -> run moi XEP HANG cho run truoc xong, khong chay
# song song. cancel-in-progress: false vi KHONG duoc huy run dang scrape do
# (se mat data + treo Chrome giua chung).
concurrency:
  group: scrape-pipeline
  cancel-in-progress: false

jobs:
  # MBW (qua Cloudflare Worker proxy) + CellPhone S - chay 100% tu dong
  # tren GitHub-hosted runner, khong can may local.
  scrape-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scraper (MBW + CPS)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MBW_PROXY_HOST: ${{ secrets.MBW_PROXY_HOST }}
          SCRAPE_DEALERS: MBW,CPS
        run: npm start

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] MBW + CPS%0Amay: cloud (ubuntu-latest)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # FPT Retail - fptshop.com.vn chan bang Cloudflare bot-challenge (KHONG phai
  # chan IP), nen doi IP hay thue VPS deu vo ich. Bat buoc self-hosted.
  # Giu label chung 'self-hosted' de MSI va BARACK deu nhan duoc - day la
  # co che du phong co chu dich, DUNG ghim vao mot may cu the.
  scrape-fpt:
    needs: scrape-cloud
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scraper (FPT)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SCRAPE_DEALERS: FPT
        run: npm start

      # Bao cao KHONG bao gio duoc lam chet scrape -> continue-on-error: true
      # Tu chua, khong phu thuoc buoc ghi moc thoi gian rieng (tung gay loi tren Windows runner)
      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUNNER_NAME: ${{ runner.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] FPT%0Amay: ${RUNNER_NAME}%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"
