name: Freeze Heavy Formulas

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install googleapis only
        run: npm install googleapis@140 --no-save --no-audit --no-fund

      - name: Run freeze-formulas.js
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node freeze-formulas.js

      - name: Commit + push freeze-report.txt
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f freeze-report.txt ] && [ -n "$(git status --porcelain freeze-report.txt)" ]; then
            git add freeze-report.txt
            git commit -m "chore: freeze report [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Khong co thay doi"
          fi
