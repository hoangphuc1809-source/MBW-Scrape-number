name: Verify FPT_TEST sheet (chi doc, khong ton phi Bright Data)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install googleapis only
        run: npm install googleapis
      - name: Verify sheet
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node verify_fpttest_sheet.js > verify_output.txt 2>&1 || (cat verify_output.txt; exit 1)

      - name: Commit ket qua
        if: always()
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p diagnostics
          cp verify_output.txt diagnostics/ 2>/dev/null || true
          if [ -n "$(git status --porcelain diagnostics)" ]; then
            git add diagnostics
            git commit -m "diag: verify FPT_TEST sheet output [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
