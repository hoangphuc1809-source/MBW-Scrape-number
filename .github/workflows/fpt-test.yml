name: FPT_TEST - Bright Data Browser API (khong dung production)

on:
  workflow_dispatch:

jobs:
  fpt-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Chay scrape + ghi tab FPT_TEST
        env:
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node fpt_test_integration.js

      - name: Bao cao Telegram (best-effort)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then exit 0; fi
          INFO=$(cat scrape-output/fpttest_summary.json 2>/dev/null || echo '{}')
          MSG="[FPT_TEST] $INFO"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" --data-urlencode "text=${MSG}" -o /dev/null -w "telegram: %{http_code}\n" || true
