name: Diagnose Sheet Formulas

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install googleapis only (bo qua puppeteer cho nhanh)
        run: npm install googleapis@140 --no-save --no-audit --no-fund

      - name: Run diagnose-sheet.js
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node diagnose-sheet.js

      - name: Commit + push diagnostic-report.txt
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f diagnostic-report.txt ] && [ -n "$(git status --porcelain diagnostic-report.txt)" ]; then
            git add diagnostic-report.txt
            git commit -m "chore: diagnostic report [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Khong co thay doi"
          fi
