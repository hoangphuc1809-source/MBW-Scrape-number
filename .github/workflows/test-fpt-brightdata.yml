name: Chan doan FPT qua Bright Data (khong dung production)

on:
  workflow_dispatch:

jobs:
  test-brightdata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Goi Bright Data Web Unlocker, chan doan trang FPT
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: fpt_scrape
        run: node test_fpt_brightdata.js

      - name: Upload ket qua chan doan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpt-brightdata-diagnostic
          path: scrape-output/*
          if-no-files-found: warn
          retention-days: 3

      - name: Commit ket qua vao repo (de doc lai qua Contents API)
        if: always()
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p diagnostics
          cp scrape-output/* diagnostics/ 2>/dev/null || true
          if [ -n "$(git status --porcelain diagnostics)" ]; then
            git add diagnostics
            git commit -m "diag(fpt): ket qua chan doan Bright Data [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Khong co gi de commit"
          fi
